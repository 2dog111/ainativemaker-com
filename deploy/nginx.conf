server {
    listen 80;
    listen [::]:80;
    server_name ainativemaker.com www.ainativemaker.com;
    return 301 https://ainativemaker.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ainativemaker.com;

    ssl_certificate /etc/letsencrypt/live/ainativemaker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ainativemaker.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ainativemaker.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ainativemaker.com;

    ssl_certificate /etc/letsencrypt/live/ainativemaker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ainativemaker.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ainativemaker.com/current;
    index index.html;

    location = /api/leads {
        proxy_pass http://127.0.0.1:8787/api/leads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /index.html {
        expires -1;
    }

    location = /robots.txt {
        expires -1;
    }

    location = /sitemap.xml {
        expires -1;
    }

    location = /journal.json {
        expires -1;
    }

    location = /llms.txt {
        expires -1;
    }

    location = /site.webmanifest {
        expires -1;
    }

    location ~* \.(?:css|js|svg|png|webp|ico)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.md https://mc.webvisor.com https://mc.webvisor.org https://yastatic.net; style-src 'self'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.md https://mc.webvisor.com https://mc.webvisor.org; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.md https://mc.webvisor.com https://mc.webvisor.org wss://mc.yandex.ru wss://mc.yandex.com wss://mc.yandex.md wss://mc.webvisor.com wss://mc.webvisor.org; child-src blob: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.md https://mc.webvisor.com https://mc.webvisor.org; frame-src blob: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.md https://mc.webvisor.com https://mc.webvisor.org; frame-ancestors 'self' https://metrika.yandex.ru https://analytics.yandex.com https://analytics.yandex.ru https://metr.yandex.com https://metr.yandex.ru https://metrica.ya.ru https://metrica.yandex.com https://metrica.yandex.ru https://metrika.ya.ru https://metrika.yandex.com https://metrika.yandex.ru; base-uri 'self'; form-action 'self'" always;
}
