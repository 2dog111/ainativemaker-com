# ainativemaker.com на американском сервере srv188 (167.17.73.188, Dallas).
# Caddy сам получает и продлевает сертификат, как только A-записи домена
# указывают на этот сервер. Эталон блока для /etc/caddy/Caddyfile.

www.ainativemaker.com {
	redir https://ainativemaker.com{uri} permanent
}

ainativemaker.com {
	encode zstd gzip
	root * /srv/ainativemaker/current

	# Заявки и закрытая админка обслуживаются Node-сервисом на 127.0.0.1:8787.
	# Внутри — персональные данные, поэтому наружу только через этот блок.
	handle /api/leads {
		reverse_proxy 127.0.0.1:8787
	}

	handle /admin* {
		reverse_proxy 127.0.0.1:8787
	}

	handle {
		file_server
	}

	@static path *.css *.js *.svg *.png *.webp *.ico
	header @static Cache-Control "public, max-age=604800"

	header {
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		Permissions-Policy "camera=(), microphone=(), geolocation=()"
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.md https://mc.webvisor.com https://mc.webvisor.org https://yastatic.net; style-src 'self'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.md https://mc.webvisor.com https://mc.webvisor.org; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.md https://mc.webvisor.com https://mc.webvisor.org wss://mc.yandex.ru wss://mc.yandex.com wss://mc.yandex.md wss://mc.webvisor.com wss://mc.webvisor.org; child-src blob: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.md https://mc.webvisor.com https://mc.webvisor.org; frame-src blob: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.md https://mc.webvisor.com https://mc.webvisor.org; frame-ancestors 'self' https://metrika.yandex.ru https://analytics.yandex.com https://analytics.yandex.ru https://metr.yandex.com https://metr.yandex.ru https://metrica.ya.ru https://metrica.yandex.com https://metrica.yandex.ru https://metrika.ya.ru https://metrika.yandex.com https://metrika.yandex.ru; base-uri 'self'; form-action 'self'"
	}

	handle_errors {
		respond "{err.status_code} {err.status_text}"
	}
}
